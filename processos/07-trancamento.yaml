codigo: "07"
titulo: Trancamento Parcial e Total de Matrícula
resumo: >-
  Como suspender a matrícula em uma ou mais disciplinas (trancamento parcial) ou no curso inteiro
  (trancamento total), e quais são os efeitos de cada um sobre os prazos.

publico_alvo:
  - Discentes regulares do Mestrado
  - Orientadores(as)
  - Secretaria e Colegiado do PPGMCS

base_normativa:
  - norma: Regulamento do PPGMCS (2024)
    dispositivos: Arts. 17, XVII; 33; 34; 35; 56, III e V

responsaveis:
  - ator: discente
    atribuicoes: Formalizar o pedido no prazo, com justificativa e anuência do(a) orientador(a).
  - ator: orientador
    atribuicoes: Dar anuência ao pedido (ou docente indicado pelo Colegiado).
  - ator: secretaria
    atribuicoes: Protocolar, verificar o prazo e o histórico de trancamentos e registrar a decisão.
  - ator: colegiado
    atribuicoes: Decidir sobre o pedido (Art. 17, XVII).

secoes_extra:
  - titulo: Parcial x total
    tabela:
      colunas: [Aspecto, Trancamento parcial, Trancamento total]
      linhas:
        - ["Abrangência", "Uma ou mais disciplinas", "Toda a matrícula no curso"]
        - ["Quando pedir", "No **primeiro 1/3 da carga horária** da disciplina", "Não definido em norma"]
        - ["Motivo", "Não exigido pela norma", "**Motivos relevantes**, comprovados"]
        - ["Anuência", "Orientador(a) ou docente indicado pelo Colegiado", "Orientador(a) ou docente indicado pelo Colegiado"]
        - ["Limite", "**Uma vez** por atividade acadêmica, durante o curso", "Não definido em norma"]
        - ["Efeito no prazo do curso", "Nenhum (o prazo de 24 meses continua correndo)", "O período trancado **não conta** no prazo máximo"]
        - ["Quem decide", "Colegiado", "Colegiado"]
        - ["Base", "Art. 33", "Arts. 34 e 56, III"]

etapas:
  - id: i
    tipo: inicio
    ator: discente
    texto: Necessidade de interromper atividades
    para: d0
  - id: d0
    tipo: decisao
    ator: discente
    texto: Que tipo de trancamento?
    para: {"Parcial": e1, "Total": e5}
  - id: e1
    ator: discente
    texto: Verificar se está no 1º terço da carga horária e se nunca trancou essa disciplina
    titulo: "Parcial: verificar condições"
    detalhe: O pedido só cabe no primeiro terço da carga horária da disciplina e uma única vez por atividade acadêmica.
    para: e2
  - id: e2
    ator: orientador
    texto: Dar anuência ao pedido
    titulo: "Parcial: anuência"
    detalhe: O(a) orientador(a), ou docente indicado pelo Colegiado, assina o pedido.
    para: e3
  - id: e3
    ator: discente
    texto: Protocolar pedido na Secretaria
    titulo: "Parcial: protocolo"
    detalhe: Protocolar o pedido indicando a(s) disciplina(s).
    para: e4
  - id: e5
    ator: discente
    texto: Reunir justificativa e comprovantes dos motivos relevantes
    titulo: "Total: justificativa"
    detalhe: Descrever os motivos relevantes e anexar comprovantes.
    para: e6
  - id: e6
    ator: orientador
    texto: Dar anuência ao pedido
    titulo: "Total: anuência"
    detalhe: O(a) orientador(a), ou docente indicado pelo Colegiado, assina o pedido.
    para: e7
  - id: e7
    ator: discente
    texto: Protocolar pedido na Secretaria
    titulo: "Total: protocolo"
    detalhe: Protocolar o pedido com o período pretendido.
    para: e4
  - id: e4
    ator: secretaria
    texto: Conferir prazo, anuência e histórico de trancamentos
    titulo: Conferência
    detalhe: A Secretaria confere os requisitos e encaminha ao Colegiado.
    para: d1
  - id: d1
    tipo: decisao
    ator: colegiado
    texto: Pedido deferido?
    para: {"Sim": e8, "Não": f2}
  - id: e8
    ator: secretaria
    texto: Registrar trancamento (total suspende a contagem do prazo)
    titulo: Registro
    detalhe: A Secretaria registra o trancamento. No total, anota o período suspenso para recalcular o prazo máximo.
    para: f1
  - id: f1
    tipo: fim
    ator: discente
    texto: Trancamento registrado
  - id: f2
    tipo: fim
    ator: discente
    texto: Matrícula mantida; cumprir as atividades

documentos:
  - nome: Requerimento de trancamento (parcial ou total)
    obs: Não há modelo oficial nos documentos consultados.
  - nome: Comprovantes dos motivos (trancamento total)
    obs: Atestados, declarações ou outros documentos.

observacoes:
  - "**Não confundir com abandono:** quem deixa de renovar a matrícula em um período é **excluído** do curso (Arts. 35 e 56, V). O trancamento total é a via formal para interromper o curso."
  - Disciplinas obrigatórias trancadas precisarão ser cursadas em outra oferta.

pendencias:
  - "**Trancamento total:** a norma não define duração máxima, quantas vezes pode ser concedido, até quando pode ser pedido nem como é feito o retorno."
  - "**Prazos:** confirmar como o 1/3 da carga horária é contado (data de início da disciplina ou calendário oficial)."
  - "**Formulário:** confirmar se existe modelo oficial de requerimento."
