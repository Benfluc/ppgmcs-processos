codigo: "08"
titulo: Aproveitamento de Disciplinas Cursadas em Outro Programa
resumo: >-
  Como pedir que créditos obtidos em outro programa de pós-graduação (stricto ou lato sensu), ou em
  disciplinas isoladas, sejam aproveitados na integralização do Mestrado do PPGMCS.

publico_alvo:
  - Discentes regulares do Mestrado
  - Ex-alunos(as) especiais que ingressaram como regulares
  - Discentes transferidos ou reoptantes
  - Orientadores(as), Secretaria e Colegiado

base_normativa:
  - norma: Regulamento do PPGMCS (2024)
    dispositivos: Arts. 17, XVII; 30, §1º; 31, §§3º e 4º; 37; 38; 39

responsaveis:
  - ator: discente
    atribuicoes: Reunir a documentação da disciplina de origem e protocolar o pedido.
  - ator: orientador
    atribuicoes: Manifestar-se sobre a pertinência da disciplina ao plano de estudos.
  - ator: secretaria
    atribuicoes: Protocolar, conferir a documentação e registrar os créditos aproveitados.
  - ator: colegiado
    atribuicoes: Decidir sobre o aproveitamento, a seu critério (Art. 39), podendo ouvir docente da área.

requisitos:
  - Ser discente regular do PPGMCS (somente regulares integralizam créditos para o título).
  - Créditos obtidos em curso de pós-graduação **stricto ou lato sensu**, ou em disciplinas isoladas (Art. 39).
  - "Cursar no PPGMCS **pelo menos 25% do total de créditos** a integralizar (Arts. 30, §1º e 39, §3º)."

secoes_extra:
  - titulo: Regras por origem dos créditos
    tabela:
      colunas: [Origem, Regra, Base]
      linhas:
        - ["Disciplina isolada cursada no PPGMCS como aluno(a) especial", "Até **16 créditos**; conceito mínimo **B**; ingresso como regular em até **3 anos**", "Art. 31, §§3º e 4º"]
        - ["Disciplina isolada fora do PPGMCS", "Decisão do Colegiado", "Art. 39, §1º"]
        - ["Especialização lato sensu oferecida pelo PPGMCS", "Decisão do Colegiado", "Art. 39, §2º"]
        - ["Outro programa stricto sensu ou lato sensu", "A critério do Colegiado", "Art. 39, caput"]
        - ["Transferência ou reopção", "Independentemente dos créditos de origem, cursar ≥ 25% no PPGMCS", "Art. 30, §1º"]
    nota: Referência de conversão do PPGMCS — 1 crédito = 15 horas-aula (Art. 37).

etapas:
  - id: i
    tipo: inicio
    ator: discente
    texto: Discente regular com disciplina cursada fora do currículo do PPGMCS
    para: e1
  - id: e1
    ator: discente
    texto: Reunir histórico, programa/ementa e carga horária da disciplina
    titulo: Reunir documentos
    detalhe: Histórico oficial com conceito/nota e frequência, programa com ementa e bibliografia, carga horária e identificação do curso de origem.
    para: e2
  - id: e2
    ator: orientador
    texto: Manifestar-se sobre a pertinência ao plano de estudos
    titulo: Manifestação do orientador
    detalhe: O(a) orientador(a) indica se a disciplina se ajusta ao plano de estudos e a qual componente corresponderia.
    para: e3
  - id: e3
    ator: discente
    texto: Protocolar o pedido na Secretaria
    titulo: Protocolo
    detalhe: Protocolar o requerimento ao Colegiado com os anexos.
    para: e4
  - id: e4
    ator: secretaria
    texto: Conferir documentos e limites (16 créditos, conceito B, 3 anos, 25%)
    titulo: Conferência
    detalhe: A Secretaria verifica a documentação e os limites aplicáveis e encaminha ao Colegiado.
    para: d1
  - id: d1
    tipo: decisao
    ator: colegiado
    texto: Aproveitamento deferido?
    para: {"Sim (total ou parcial)": e5, "Não": f2}
  - id: e5
    ator: secretaria
    texto: Registrar créditos aproveitados no histórico
    titulo: Registro
    detalhe: Lançamento dos créditos deferidos, com indicação da origem.
    para: f1
  - id: f1
    tipo: fim
    ator: discente
    texto: Créditos aproveitados
  - id: f2
    tipo: fim
    ator: discente
    texto: Cursar os créditos no PPGMCS

documentos:
  - nome: Requerimento de aproveitamento de créditos
    obs: Não há modelo oficial nos documentos consultados.
  - nome: Histórico escolar oficial da instituição de origem
    obs: Com conceito ou nota, frequência e período.
  - nome: Programa da disciplina (ementa, bibliografia e carga horária)
    obs: Permite ao Colegiado avaliar equivalência.

observacoes:
  - O aproveitamento é **a critério do Colegiado**; não há direito automático (Art. 39).
  - "A regra de crédito do PPGMCS exige conceito mínimo C (Art. 38), mas, para disciplinas isoladas cursadas no Programa, o mínimo é B (Art. 31, §4º)."

pendencias:
  - "**Conceito mínimo:** confirmar o mínimo exigido para disciplinas de outros programas (B, como nas isoladas, ou C, como na regra geral)."
  - "**Validade:** confirmar se há prazo máximo entre a conclusão da disciplina e o pedido (o limite de 3 anos só está previsto para aluno especial)."
  - "**Teto de créditos:** confirmar se o limite de 16 créditos vale também para outros programas."
  - "**Equivalência com obrigatórias:** confirmar se disciplinas externas podem substituir obrigatórias (Seminários, Introdução à Modelagem Computacional, Visualização Científica, Estatística e Probabilidade)."
  - "**Conversão:** confirmar a regra quando a instituição de origem usa outra relação crédito/hora."
  - "**Prazo e formulário:** confirmar período para protocolo e modelo de requerimento."
