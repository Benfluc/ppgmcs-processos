codigo: "05"
titulo: Atividade Acadêmica de Créditos Especiais
resumo: >-
  Como obter créditos por produção acadêmica ligada ao projeto de dissertação. Créditos Especiais A é
  obrigatória para todos; Créditos Especiais B e C são optativas e usam a mesma tabela de atividades.

publico_alvo:
  - Discentes regulares do Mestrado
  - Orientadores(as)
  - Secretaria e Colegiado do PPGMCS

base_normativa:
  - norma: Resolução PPGMCS nº 001/2024
    dispositivos: Arts. 3º, 5º e 8º
  - norma: Regulamento do PPGMCS (2024)
    dispositivos: Arts. 37, §1º; 50

responsaveis:
  - ator: discente
    atribuicoes: Produzir a atividade com participação do(a) orientador(a), reunir comprovantes e solicitar o aproveitamento.
  - ator: orientador
    atribuicoes: Participar da produção (exigido na maioria dos itens) e dar anuência ao pedido.
  - ator: secretaria
    atribuicoes: Protocolar, conferir os comprovantes e lançar a disciplina no histórico.
  - ator: colegiado
    atribuicoes: Analisar e homologar a atribuição dos créditos.

requisitos:
  - A atividade deve estar **relacionada ao projeto de dissertação**.
  - Deve haver **participação do(a) orientador(a)**, conforme exigido em cada item da tabela.
  - Respeitar a **posição de autoria** exigida (primeiro ou segundo autor, conforme o item).

secoes_extra:
  - titulo: Tabela de atividades (Res. 001/2024, Art. 8º)
    tabela:
      colunas: [Atividade, Créditos]
      linhas:
        - ["Artigo em revista Qualis **A1–A4**, como 1º ou 2º autor, com participação do(a) orientador(a)", "**8**"]
        - ["Depósito de patente relacionada ao projeto de dissertação", "**8**"]
        - ["Artigo em revista Qualis **B1–B4**, como 1º ou 2º autor, com participação do(a) orientador(a)", "**4**"]
        - ["Livro ou capítulo de livro com o(a) orientador(a), como 1º autor", "**4**"]
        - ["Trabalho completo em anais de evento, como 1º autor, com participação do(a) orientador(a)", "**4**"]
        - ["Resumo expandido em evento oficial da Unimontes, como 1º autor, com participação do(a) orientador(a)", "**2**"]
  - titulo: Como os créditos se distribuem
    itens:
      - "**Créditos Especiais A** (4 créditos) — **obrigatória** para todos; integra os 28 créditos em disciplinas."
      - "**Créditos Especiais B e C** (4 créditos cada) — optativas, integralizadas com as mesmas atividades (Art. 8º, §1º)."
      - "Atividade de **8 créditos** pode completar **duas** disciplinas de créditos especiais (Art. 8º, §2º). Exemplo: um artigo A2 completa Créditos Especiais A e B."

etapas:
  - id: i
    tipo: inicio
    ator: discente
    texto: Produção ligada ao projeto de dissertação
    para: e1
  - id: e1
    ator: discente
    texto: Publicar / apresentar / depositar com participação do orientador
    titulo: Realizar a atividade
    detalhe: Desenvolver a produção conforme a tabela, observando autoria e participação do(a) orientador(a).
    para: e2
  - id: e2
    ator: discente
    texto: Reunir comprovantes (publicação, anais, certificado, depósito)
    titulo: Reunir comprovantes
    detalhe: Separar os comprovantes que identifiquem autoria, veículo, estrato Qualis (quando for o caso) e data.
    para: e3
  - id: e3
    ator: orientador
    texto: Dar anuência ao pedido
    titulo: Anuência
    detalhe: O(a) orientador(a) confirma a relação com o projeto e a sua participação.
    para: e4
  - id: e4
    ator: discente
    texto: Protocolar pedido na Secretaria indicando a disciplina (A, B ou C)
    titulo: Pedido
    detalhe: Protocolar o pedido indicando qual disciplina de créditos especiais deve ser integralizada.
    para: e5
  - id: e5
    ator: secretaria
    texto: Conferir comprovantes e enquadramento na tabela
    titulo: Conferência
    detalhe: A Secretaria confere os documentos e o item da tabela.
    para: d1
  - id: d1
    tipo: decisao
    ator: colegiado
    texto: Colegiado homologa?
    para: {"Sim": e6, "Não": e7}
  - id: e7
    ator: discente
    texto: Complementar comprovação ou nova atividade
    titulo: Indeferimento
    detalhe: Em caso de indeferimento, o(a) discente pode complementar a comprovação ou apresentar outra atividade.
    para: e2
  - id: e6
    ator: secretaria
    texto: Lançar a disciplina (4 créditos) no histórico
    titulo: Lançamento
    detalhe: A Secretaria lança a(s) disciplina(s) de créditos especiais no histórico.
    para: f1
  - id: f1
    tipo: fim
    ator: discente
    texto: Créditos Especiais integralizados

aviso:
  titulo: Fluxo administrativo proposto
  texto: As normas definem as atividades e os créditos, mas não o rito do pedido (formulário, prazo, instância que decide). O fluxo abaixo segue a regra geral do Regulamento, que dá ao Colegiado a decisão sobre créditos e aproveitamento, e deve ser validado pela Coordenação.

prazos:
  - item: Integralizar Créditos Especiais A
    prazo: Antes do pedido de defesa (todos os créditos em disciplinas são pré-requisito)
    fonte: Regulamento, Arts. 40 e 44, I
  - item: Prazo para protocolar o pedido
    prazo: Não definido em norma
    fonte: "—"

documentos:
  - nome: Requerimento de atribuição de créditos especiais
    obs: Não há modelo oficial nos documentos consultados.
  - nome: Comprovantes da atividade
    obs: Artigo publicado ou aceite, anais, certificado de apresentação, comprovante de depósito de patente.

observacoes:
  - O Regulamento permite créditos especiais **somente para completar** o número de créditos necessários (Art. 50).

pendencias:
  - "**Limite de créditos especiais:** o Regulamento (Art. 50) limita a 25% dos créditos mínimos em disciplinas, ou seja, 7 de 28. Créditos Especiais A + B já somam 8, e A + B + C somam 12. O Art. 37, §1º, fala em até 50% para \"outras atividades\". Confirmar o limite aplicável."
  - "**Somar atividades menores:** a norma trata do aproveitamento de atividades acima de 4 créditos (Art. 8º, §2º), mas não diz se dois resumos expandidos (2 + 2) completam uma disciplina."
  - "**Aceite x publicação:** confirmar se o aceite final basta ou se é exigida a publicação."
  - "**Qualis:** confirmar qual edição da classificação Qualis vale para o enquadramento."
  - "**Rito:** confirmar formulário, prazo e se a decisão é do Colegiado ou delegada à Coordenação."
