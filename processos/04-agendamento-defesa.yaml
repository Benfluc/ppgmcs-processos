codigo: "04"
titulo: Agendamento da Defesa de Dissertação
resumo: >-
  Como solicitar, agendar e realizar a defesa pública do trabalho de conclusão do Mestrado e o que fazer
  depois dela (versão final e diplomação).

publico_alvo:
  - Discentes regulares aprovados no Exame de Qualificação
  - Orientadores(as), coorientadores(as) e membros de banca
  - Secretaria e Coordenação do PPGMCS

base_normativa:
  - norma: Regulamento do PPGMCS (2024)
    dispositivos: Arts. 40, 44 a 49, 53
  - norma: Resolução PPGMCS nº 004/2019
    dispositivos: Arts. 5º a 10
  - norma: Resolução PPGMCS nº 001/2024
    dispositivos: Arts. 5º e 10
  - norma: Orientação da Coordenação (nov./2026)
    dispositivos: Composição mínima da banca

responsaveis:
  - ator: discente
    atribuicoes: Cumprir os requisitos, preencher o requerimento e o Anexo I, depositar o trabalho, enviar cópias à banca, defender e entregar a versão final.
  - ator: orientador
    atribuicoes: Dar anuência ao pedido, indicar banca e data e presidir a sessão.
  - ator: secretaria
    atribuicoes: Protocolar e conferir o pedido, divulgar a sessão, arquivar ata e folha de aprovação e encaminhar a diplomação.
  - ator: colegiado
    atribuicoes: Aprovar e designar a banca, decidir sobre defesa fechada e sobre nova defesa em caso de insucesso.
  - ator: banca
    atribuicoes: Avaliar o trabalho, lavrar e assinar a ata e a folha de aprovação e indicar as correções.

requisitos:
  - Ter integralizado **todos os créditos em disciplinas** (28), incluindo Créditos Especiais A (Regulamento, Arts. 40 e 44, I).
  - Ter sido **aprovado(a) no Exame de Qualificação** (Art. 44, II).
  - "Ter **artigo sobre o trabalho aceito** em evento de abrangência nacional ou em revista indexada pela CAPES (Res. 004/2019, Art. 5º). Pode ser dispensado quando o trabalho de conclusão for um produto (Portaria CAPES nº 17/2009)."
  - Apresentar **aprovação do Comitê de Ética em Pesquisa**, se o trabalho envolver seres humanos ou animais (Res. 004/2019, Art. 8º, a).
  - Estar dentro do prazo de **depósito: até o 23º mês** do curso (Res. 001/2024, Art. 10).

secoes_extra:
  - titulo: Banca examinadora
    itens:
      - "**Mínimo de 3 membros**, todos com título de Doutor: o(a) **orientador(a), como presidente**; **1 docente credenciado(a) no PPGMCS**; e **1 membro externo**."
      - Coorientadores(as) podem participar, mas não contam para o número mínimo (Regulamento, Art. 46, §4º).
      - O(a) orientador(a) pode indicar os membros e a data; a banca é aprovada e designada pelo Colegiado (Art. 46).
  - titulo: Formatos aceitos para o trabalho de conclusão (Res. 004/2019, Art. 7º)
    itens:
      - Dissertação redigida em português (inglês ou espanhol só em casos excepcionais, a critério do Colegiado).
      - Artigo publicado em periódico com, no mínimo, Qualis CAPES B1.
      - Registro de propriedade intelectual ou de software, ou protótipo para desenvolvimento de produto.
  - titulo: A sessão
    itens:
      - A sessão é **pública**. Em casos de proteção intelectual, pode ser **fechada por decisão do Colegiado**, com termo de sigilo.
      - "Aprovação: somente por **decisão unânime** da banca (Art. 47)."
      - Lavram-se a ata e a Folha de Aprovação, assinadas por todos os membros.

etapas:
  - id: i
    tipo: inicio
    ator: discente
    texto: Qualificação aprovada e 28 créditos em disciplinas
    para: e1
  - id: e1
    ator: orientador
    texto: Definir banca (mín. 3), data, horário e local
    titulo: Definir banca e data
    detalhe: Orientador(a) e discente definem a banca (orientador + 1 credenciado no PPGMCS + 1 externo), a data, o horário e o local ou link.
    para: e2
  - id: e2
    ator: discente
    texto: "Preencher requerimento + Anexo I (assinaturas do aluno e do orientador)"
    titulo: Preencher o requerimento
    detalhe: Preencher o Requerimento de Defesa de Dissertação e o Anexo I (dados do aluno, título, data, local, horário e banca).
    para: e3
  - id: e3
    ator: discente
    texto: "Depositar na Secretaria: requerimento, 1 cópia do trabalho, aceite do artigo, parecer do CEP (se houver)"
    titulo: Depósito (até o 23º mês)
    detalhe: Entregar o requerimento, uma cópia do trabalho, o comprovante de aceite do artigo (carta ou e-mail do editor) e, se for o caso, a aprovação do CEP.
    para: d1
  - id: d1
    tipo: decisao
    ator: secretaria
    texto: Requisitos e documentos conferidos?
    para: {"Não": e3b, "Sim": e4}
  - id: e3b
    ator: discente
    texto: Complementar documentação
    titulo: Complementação
    detalhe: Se faltar algum item, o(a) discente complementa e reapresenta.
    para: e3
  - id: e4
    ator: colegiado
    texto: Aprovar e designar a banca (e decidir sessão fechada, se houver)
    titulo: Aprovação da banca
    detalhe: O Colegiado aprova a banca e, nos casos de proteção intelectual, decide se a sessão será fechada.
    para: e5
  - id: e5
    ator: discente
    texto: Enviar o trabalho aos membros da banca
    titulo: Envio à banca
    detalhe: O(a) discente, com anuência do(a) orientador(a), envia as cópias (digitais ou impressas). A Secretaria divulga a sessão.
    para: e6
  - id: e6
    ator: banca
    texto: Sessão pública de defesa
    titulo: Defesa
    detalhe: Apresentação e arguição. Lavram-se a ata e a Folha de Aprovação.
    para: d2
  - id: d2
    tipo: decisao
    ator: banca
    texto: Aprovação unânime?
    para: {"Sim": e7, "Não": e8}
  - id: e8
    ator: colegiado
    texto: Pode conceder nova defesa (até 6 meses; 60 dias se já houve prorrogação)
    titulo: Insucesso
    detalhe: Mediante proposta justificada da banca, o Colegiado pode conceder nova defesa em até 6 meses, respeitado o prazo máximo do curso. Se o(a) discente já teve prorrogação, o prazo pode ser de até 60 dias.
    para: e6
  - id: e7
    ator: discente
    texto: Entregar versão final, versão eletrônica e termo de divulgação (até 60 dias)
    titulo: Versão final
    detalhe: Incorporar as correções da banca e entregar a versão final, a versão eletrônica completa e o termo de consentimento para divulgação on-line, em até 60 dias.
    para: e9
  - id: e9
    ator: secretaria
    texto: Conferir quitação com a Biblioteca e enviar documentos à PRPG
    titulo: Diplomação
    detalhe: Com a quitação junto à Biblioteca, a Secretaria envia a documentação à PRPG para expedição do diploma.
    para: f1
  - id: f1
    tipo: fim
    ator: prpg
    texto: Diploma de Mestre expedido

prazos:
  - item: Depósito da dissertação
    prazo: Até o 23º mês (prorrogável por 6 meses, com justificativa ao Colegiado)
    fonte: Res. 001/2024, Art. 10
  - item: Entrega da versão final
    prazo: Até 60 dias após a aprovação
    fonte: Res. 004/2019, Art. 9º, §1º
  - item: Nova defesa em caso de insucesso
    prazo: Até 6 meses (até 60 dias se já houve prorrogação)
    fonte: Regulamento, Art. 48; Res. 004/2019, Art. 9º, §2º
  - item: Antecedência mínima entre o pedido e a sessão
    prazo: Não definida em norma
    fonte: "—"

documentos:
  - nome: Requerimento de Defesa de Dissertação + Anexo I
    obs: Assinado pelo(a) discente e pelo(a) orientador(a).
  - nome: 1 cópia do trabalho
    obs: As cópias da banca são enviadas pelo(a) discente.
  - nome: Comprovante de artigo aceito
    obs: Carta ou e-mail de aceite do editor.
  - nome: Aprovação do Comitê de Ética
    obs: Somente se houver pesquisa com seres humanos ou animais.
  - nome: Ata, Folha de Aprovação, versão final, termo de divulgação e quitação da Biblioteca
    obs: Após a defesa.

observacoes:
  - O requisito de ter assistido a cinco bancas **não é exigido**, conforme orientação da Coordenação.
  - A aprovação na defesa também é o que conclui a disciplina Dissertação IV (Regulamento, Art. 49, §3º).

pendencias:
  - "**Banca:** o Regulamento de 2024 (Art. 46, §3º) exige no mínimo 4 membros (incluindo externo à Unimontes e suplente). A Coordenação orienta mínimo de 3. É preciso confirmar o ato que formaliza a regra e se \"externo\" significa externo ao PPGMCS ou à Unimontes."
  - "**Artigo aceito (Res. 004/2019, Art. 5º):** confirmar se continua exigido, já que Créditos Especiais A (Res. 001/2024) também exige produção acadêmica."
  - "**Formulário desatualizado:** endereçado ao Prof. Renê Rodrigues Veloso e cita \"Capítulos VII e XVI\" e o \"Art. 35 do Regimento interno\", que no Regulamento de 2024 trata de outro assunto."
  - "**Defesa fechada:** a Res. 004/2019 (Art. 10) diz que \"será\" fechada; o Regulamento de 2024 (Art. 46, §5º), que \"poderá\" ser, por decisão do Colegiado. Adotou-se o Regulamento."
