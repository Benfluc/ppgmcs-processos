codigo: "02"
titulo: Requisitos para Obtenção do Título de Mestre
resumo: >-
  O que o(a) discente precisa cumprir, e em que prazos, para receber o diploma de Mestre em Modelagem
  Computacional e Sistemas: 38 créditos, disciplinas obrigatórias, qualificação, defesa e entrega da
  versão final.

publico_alvo:
  - Discentes regulares do Mestrado (em especial ingressantes)
  - Orientadores(as)
  - Secretaria e Coordenação do PPGMCS

base_normativa:
  - norma: Resolução PPGMCS nº 001/2024
    dispositivos: Arts. 3º, 5º a 10
  - norma: Regulamento do PPGMCS (2024)
    dispositivos: Arts. 12, 32, 35, 37, 38, 40, 44, 49, 53, 55, 56
  - norma: Resolução PPGMCS nº 004/2019
    dispositivos: Art. 9º (versão final)

responsaveis:
  - ator: discente
    atribuicoes: Planejar o percurso com o(a) orientador(a), renovar a matrícula a cada período e cumprir créditos e prazos.
  - ator: orientador
    atribuicoes: Aprovar o plano de estudos, dar anuência às matrículas e às optativas, acompanhar prazos.
  - ator: secretaria
    atribuicoes: Registrar matrículas e créditos, conferir requisitos e enviar a documentação de diplomação à PRPG.
  - ator: colegiado
    atribuicoes: Decidir prorrogações de prazo, casos excepcionais e desligamentos.
  - ator: prpg
    atribuicoes: Expedir o diploma (PRPG) e registrá-lo (Secretaria Geral).

etapas:
  - id: i
    tipo: inicio
    ator: discente
    texto: Matrícula como discente regular (mês 1)
    para: e1
  - id: e1
    ator: discente
    texto: Cursar disciplinas obrigatórias e optativas (renovar matrícula a cada período)
    titulo: Disciplinas
    detalhe: Matricular-se a cada período, com anuência do(a) orientador(a). Deixar de renovar a matrícula leva à exclusão (Art. 35).
    para: e2
  - id: e2
    ator: discente
    texto: Cursar Seminários no 2º semestre (pré-projeto)
    titulo: Seminários
    detalhe: Obrigatória para todos e cursada no 2º semestre, com apresentação do pré-projeto. Impossibilidade deve ser justificada ao Colegiado.
    para: e3
  - id: e3
    ator: discente
    texto: Qualificação aprovada até o 14º mês (+4 créditos)
    titulo: Exame de Qualificação
    detalhe: Exige pelo menos 12 créditos e aprovação em Seminários (ver Processo 03).
    para: e4
  - id: e4
    ator: discente
    texto: Completar 28 créditos em disciplinas, incluindo Créditos Especiais A
    titulo: Integralizar as disciplinas
    detalhe: Inclui Créditos Especiais A, obrigatória (ver Processo 05).
    para: e5
  - id: e5
    ator: discente
    texto: Depositar a dissertação até o 23º mês
    titulo: Depósito e defesa
    detalhe: O depósito na Secretaria ocorre até o 23º mês (ver Processo 04). A aprovação na defesa conclui Dissertação IV.
    para: d1
  - id: d1
    tipo: decisao
    ator: banca
    texto: Aprovação unânime da banca?
    para: {"Sim": e6, "Não": e5b}
  - id: e5b
    ator: colegiado
    texto: Nova defesa em até 6 meses, se proposta pela banca
    titulo: Insucesso na defesa
    detalhe: O Colegiado pode conceder nova defesa em até 6 meses, mediante proposta justificada da banca, respeitado o prazo máximo do curso.
    para: d1
  - id: e6
    ator: discente
    texto: Entregar versão final em até 60 dias e quitação da Biblioteca
    titulo: Versão final
    detalhe: Entregar a versão final com as correções da banca, a versão eletrônica, o termo de autorização de divulgação e a comprovação de quitação com a Biblioteca.
    para: e7
  - id: e7
    ator: secretaria
    texto: Conferir requisitos e enviar documentos à PRPG
    titulo: Diplomação
    detalhe: A Secretaria confere o cumprimento do Art. 49 e envia a documentação à PRPG.
    para: f1
  - id: f1
    tipo: fim
    ator: prpg
    texto: Diploma expedido (PRPG) e registrado (Secretaria Geral)

secoes_extra:
  - titulo: Composição dos 38 créditos
    tabela:
      colunas: [Componente, Créditos, Observação]
      linhas:
        - ["Seminários (obrigatória)", "4", "Cursada no 2º semestre"]
        - ["2 entre: Introdução à Modelagem Computacional, Visualização Científica e Estatística e Probabilidade", "8", "Obrigatórias de escolha (4 cada)"]
        - ["Créditos Especiais A (obrigatória)", "4", "Por produção acadêmica (Processo 05)"]
        - ["Optativas", "12", "3 disciplinas de 4 créditos"]
        - ["**Subtotal em disciplinas**", "**28**", "Res. 001/2024, Art. 5º"]
        - ["Exame de Qualificação", "4", "Até o 14º mês"]
        - ["Dissertação (Dissertação I a IV)", "6", "Concluída com a aprovação na defesa"]
        - ["**Total**", "**38**", "Res. 001/2024, Art. 5º"]
  - titulo: Disciplinas optativas (Res. 001/2024, Tabela 1)
    texto: >-
      Introdução ao Aprendizado de Máquina · Introdução à Inteligência Computacional · Aplicações de Otimização ·
      Aplicações de Ciência de Dados · Aplicações de Redes Neurais Artificiais · Aplicações de Sistemas Nebulosos ·
      Empreendedorismo e Inovação · Créditos Especiais B e C · Estudos Dirigidos A, B e C (Processo 06) ·
      Tópicos Especiais A, B e C. Todas valem 4 créditos (60 h).
    nota: Ver pendências quanto à contagem da terceira obrigatória.
  - titulo: Regras de aprovação e frequência
    itens:
      - 1 crédito = 15 horas-aula (Regulamento, Art. 37).
      - Créditos só são conferidos com conceito mínimo **C** (70 pontos) e **75% de frequência**; não há abono de faltas (Art. 38).
      - "Escala: A (90–100), B (80–89), C (70–79), D (60–69), E (40–59), F (0–39). Pode ser usado APTO/INAPTO quando a escala não se aplicar (Art. 43)."

prazos:
  - item: Duração máxima do curso
    prazo: 24 meses a partir da 1ª matrícula regular
    fonte: Regulamento, Art. 12, III
  - item: Seminários
    prazo: 2º semestre
    fonte: Res. 001/2024, Art. 6º
  - item: Exame de Qualificação concluído
    prazo: Até o 14º mês
    fonte: Res. 001/2024, Art. 9º
  - item: Depósito da dissertação na Secretaria
    prazo: Até o 23º mês (prorrogável por 6 meses, com justificativa)
    fonte: Res. 001/2024, Art. 10
  - item: Pedido de prorrogação do prazo máximo (até 6 meses)
    prazo: Com **pelo menos 2 meses** de antecedência do fim do prazo
    fonte: Regulamento, Art. 12, §2º
  - item: Entrega da versão final após a defesa
    prazo: Até 60 dias
    fonte: Res. 004/2019, Art. 9º, §1º

documentos:
  - nome: Pedido de prorrogação de prazo
    obs: Justificado, com parecer favorável do(a) orientador(a), plano de estudo e novo cronograma de até 6 meses. O(a) discente deve ter cumprido os demais requisitos do curso.
  - nome: Versão final e versão eletrônica da dissertação
    obs: Ou relatório descritivo nos moldes do INPI, no caso de produtos e processos inovadores.
  - nome: Termo de consentimento para divulgação on-line
    obs: Entregue após a aprovação.
  - nome: Comprovante de quitação com a Biblioteca Universitária
    obs: Exigido para o diploma (Arts. 49, IV e 53, II).

observacoes:
  - "**Desligamento automático (Art. 56):** dois conceitos D, E ou F (na mesma ou em disciplinas diferentes); qualificação fora do prazo; ultrapassar 24 meses (ou 30, com prorrogação) sem concluir; desempenho insuficiente a critério do Colegiado; não renovar a matrícula; falta disciplinar grave."
  - O período de trancamento total não conta no prazo máximo (Processo 07).
  - Se a defesa for antecipada, as disciplinas de Dissertação faltantes são consideradas cursadas (Art. 49, §2º).

pendencias:
  - "**Créditos de qualificação e dissertação:** a Tabela 1 da Res. 001/2024 lista Dissertação I a IV com 0 crédito, mas o Art. 5º atribui 6 créditos à dissertação e 4 ao exame de qualificação. Confirmar como são lançados no histórico."
  - "**Terceira obrigatória:** confirmar se a obrigatória de escolha não exigida, quando cursada, conta como optativa."
  - "**Ementas:** Visualização Científica (obrigatória) não tem ementa no Art. 11; e a ementa de Introdução à Dosimetria Termoluminescente aparece no Art. 11, mas a disciplina não consta da Tabela 1."
  - "**Prorrogação:** o Regulamento exige pedido 2 meses antes do fim do prazo; a Res. 001/2024 permite estender o depósito em 6 meses \"desde que justificado\". Confirmar se valem as duas regras."
